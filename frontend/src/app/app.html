<div class="flex min-h-screen flex-col">
  <app-header (menuRequested)="onMenuToggle()" />
  <div class="flex flex-1">
    @if (session.isAuthenticated()) {
      @if (!sidebarCollapsed()) {
        <aside class="hidden w-64 shrink-0 border-r border-slate-200 bg-white p-3 lg:block">
          <app-aside (navigated)="closeMenu()" />
        </aside>
      }
      <p-drawer
        header="Menú"
        position="left"
        [visible]="mobileOpen()"
        (visibleChange)="mobileOpen.set($event)"
        styleClass="w-72"
      >
        <app-aside (navigated)="closeMenu()" />
      </p-drawer>
    }
    <section class="min-w-0 flex-1 p-6">
      <router-outlet />
    </section>
  </div>
  <app-footer />
</div>
<p-toast />
