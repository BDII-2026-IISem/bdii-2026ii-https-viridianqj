<section class="flex flex-col gap-4">
  <header class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-xl font-semibold text-slate-800">Asignaciones de rol</h1>
      <p class="text-sm text-slate-500">{{ items().length }} registros</p>
    </div>
    <div class="flex gap-2">
      <p-button *appHasPermission="'POST /api/role-users/'" label="Nueva asignación" icon="pi pi-plus" (onClick)="openCreate()" />
      <p-button label="Actualizar" icon="pi pi-refresh" severity="secondary" [outlined]="true" (onClick)="loadAll()" />
    </div>
  </header>

  @if (error()) {
    <div class="rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ error() }}</div>
  }

  <p-table [value]="rows()" [loading]="loading()" dataKey="id" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 25, 50]">
    <ng-template #header>
      <tr>
        <th pSortableColumn="id">ID <p-sort-icon field="id" /></th>
        <th pSortableColumn="username">Usuario <p-sort-icon field="username" /></th>
        <th pSortableColumn="roleName">Rol <p-sort-icon field="roleName" /></th>
        <th pSortableColumn="status">Estado <p-sort-icon field="status" /></th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-row>
      <tr>
        <td>#{{ row.id }}</td>
        <td>{{ row.username }}</td>
        <td>{{ row.roleName }}</td>
        <td><p-tag [value]="stateLabel(row.status)" [severity]="stateSeverity(row.status)" /></td>
        <td class="flex gap-1">
          <p-button *appHasPermission="'PATCH /api/role-users/:id/'" icon="pi pi-pencil" [text]="true" (onClick)="openEdit(row)" />
          <p-button *appHasPermission="'DELETE /api/role-users/:id/'" icon="pi pi-trash" severity="danger" [text]="true" (onClick)="remove(row)" />
        </td>
      </tr>
    </ng-template>
  </p-table>
</section>

<p-dialog [header]="editing() ? 'Editar asignación' : 'Nueva asignación'" [visible]="dialogOpen()" (onHide)="dialogOpen.set(false)" [modal]="true" [style]="{ width: '28rem' }">
  <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-3">
    <div class="flex flex-col gap-1">
      <label for="user" class="text-sm font-medium text-slate-700">Usuario</label>
      <p-select inputId="user" formControlName="user" [options]="userOptions()" optionLabel="label" optionValue="value" [filter]="true" filterBy="label" placeholder="Elige un usuario" styleClass="w-full" />
    </div>

    <div class="flex flex-col gap-1">
      <label for="role" class="text-sm font-medium text-slate-700">Rol</label>
      <p-select inputId="role" formControlName="role" [options]="roleOptions()" optionLabel="label" optionValue="value" [filter]="true" filterBy="label" placeholder="Elige un rol" styleClass="w-full" />
    </div>

    <div class="flex flex-col gap-1">
      <label for="status" class="text-sm font-medium text-slate-700">Estado</label>
      <p-select inputId="status" formControlName="status" [options]="statusOptions" optionLabel="label" optionValue="value" styleClass="w-full" />
    </div>

    @if (formError()) {
      <div class="rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ formError() }}</div>
    }

    <div class="flex justify-end gap-2 pt-2">
      <p-button label="Cancelar" type="button" severity="secondary" [outlined]="true" (onClick)="dialogOpen.set(false)" />
      <p-button label="Guardar" type="submit" [loading]="saving()" [disabled]="form.invalid" />
    </div>
  </form>
</p-dialog>
