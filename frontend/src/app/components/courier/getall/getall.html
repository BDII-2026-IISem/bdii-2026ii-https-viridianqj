<section class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
  <div class="mb-4 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-teal-50 text-teal-700">
        <i class="pi pi-id-card text-lg"></i>
      </span>
      <div>
        <h2 class="text-xl font-semibold text-slate-800">Domiciliarios</h2>
        <p class="text-sm text-slate-500">{{ items().length }} {{ items().length === 1 ? 'registro' : 'registros' }}</p>
      </div>
    </div>
    <p-button label="Actualizar" icon="pi pi-refresh" severity="secondary" [outlined]="true" (onClick)="load()" />
  </div>

  @if (error()) {
    <div class="mb-4 rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ error() }}</div>
  }

  <p-table
    [value]="items()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [stripedRows]="true"
    dataKey="id"
    size="small"
    [tableStyle]="{ 'min-width': '30rem' }"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="id">ID <p-sort-icon field="id" /></th>
        <th pSortableColumn="name">Nombre <p-sort-icon field="name" /></th>
        <th>Descripción</th>
        <th pSortableColumn="status">Estado <p-sort-icon field="status" /></th>
      </tr>
    </ng-template>

    <ng-template #body let-row>
      <tr>
        <td>#{{ row.id }}</td>
        <td>{{ row.name }}</td>
        <td>{{ row.description ?? '—' }}</td>
        <td><p-tag [value]="label(row.status)" [severity]="severity(row.status)" /></td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr><td colspan="4" class="p-6 text-center text-slate-500">No hay domiciliarios para mostrar.</td></tr>
    </ng-template>
  </p-table>
</section>
